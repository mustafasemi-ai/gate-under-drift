[project]
name = "driftgate"
version = "0.1.0"
description = "Does a confidence gate survive sensor drift, and can its failure be noticed without labels?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Only needed for the architecture comparison on SECOM (scripts/secom_archs.py).
boosting = ["xgboost>=3.0", "lightgbm>=4.0", "catboost>=1.2"]
tabpfn = ["tabpfn>=2.0"]
plots = ["matplotlib>=3.9"]
dev = ["ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftgate"]

# RTX 50xx (sm_120) needs the cu128 build of torch.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
